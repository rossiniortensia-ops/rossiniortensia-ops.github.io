# yublog Netlify 配置（仓库根目录，构建时读取）

[build.environment]
  NODE_VERSION = "22.11.0"

# 旧域名跳转
[[redirects]]
  from = "https://blog.yusite.top/*"
  to = "https://yu-blog.top/:splat"
  force = true

# 以下 8 篇文章已迁移至 sliorean.site，原链接 301 跳转到对应文章
# 使用「/路径*」通配形式，兼容带斜杠 / 不带斜杠两种请求形式

[[redirects]]
  from = "/23679*"
  to = "https://sliorean.site/2026/02/OpenClaw_Installation_Guide/"
  status = 301

