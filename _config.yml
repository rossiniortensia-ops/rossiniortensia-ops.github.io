# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 裕裕裕的小破宅
subtitle: '裕裕裕的小破宅'
description: '你永远可以在我这里找到一座避风港'
keywords: 博客, 技术, 教程, 裕裕裕, 小破宅
author: 裕裕裕
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://yu-blog.top/
permalink: :abbrlink/
permalink_defaults:
          alg: crc32
          rep: hex
pretty_urls:
  trailing_index: false # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# 本地搜索数据源（hexo-generator-searchdb）
search:
  path: search.xml
  field: post
  content: true
  format: html

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# 搜索引擎自动提交配置
hexo_submit_urls_to_search_engine:
  submit_condition: count  # 提交条件：count | period
  count: 10               # 提交最新的10个链接
  period: 900             # 提交修改时间在900秒内的链接
  google: 1               # 是否向Google提交，1:是 0:否
  bing: 1                 # 是否向Bing提交
  txt_path: ../submit_urls.txt

  # Bing配置  
  bing_host: https://yu-blog.top
  bing_token: '731fd10b5ddd486485fc45acec3d23e2'   # 需要替换为您的Bing API密钥
  
  # Google配置
  google_host: https://yu-blog.top
  google_key_file: google-service-account.json  # Google服务账号JSON文件名
  google_proxy: 0  # 如果需要代理访问Google，否则设为0
  
  # 链接替换（可选）
  replace: 0              # 是否替换链接中的部分字符串
  find_what: example
  replace_with: yu-blog.top



# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  - type: git
    repository: https://github.com/rossiniortensia-ops/rossiniortensia-ops.github.io.git
    branch: main
  - type: cjh_google_url_submitter
  - type: cjh_bing_url_submitter
theme_config:
  post_default_img: /img/default.jpg

